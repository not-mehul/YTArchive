<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Chive">
  <!-- Chive mark: a green sprig with two flower buds on a near-black field -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14110e"/>
      <stop offset="1" stop-color="#0c0a08"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="32" height="32" rx="6" fill="url(#bg)"/>
  <!-- faint chive-green inner edge -->
  <rect x="1.25" y="1.25" width="29.5" height="29.5" rx="5" fill="none"
        stroke="#a7d65a" stroke-opacity="0.20" stroke-width="1"/>
  <!-- stalks -->
  <g fill="none" stroke="#a7d65a" stroke-width="2.6" stroke-linecap="round">
    <path d="M16 28 C 16 19 12.5 14 16 7"/>
    <path d="M16 28 C 16 21 21 16.5 24 11"/>
  </g>
  <!-- flower buds (purple pompoms) -->
  <circle cx="16" cy="6" r="3.1" fill="#c9a8e0"/>
  <circle cx="24.4" cy="10.2" r="2.3" fill="#c9a8e0"/>
</svg>
